spring.application.name=order-service

# 默认使用 dev profile（H2 内存库）；生产环境以 --spring.profiles.active=prod 启动
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:h2:mem:orderdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# 仅用于 dev/测试的建表和种子数据；生产库结构应由迁移工具管理
spring.sql.init.mode=always
spring.flyway.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
